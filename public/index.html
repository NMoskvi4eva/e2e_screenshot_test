<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Локальна сторінка</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    input { display: block; margin-bottom: 10px; padding: 8px; width: 200px; }
    button { padding: 8px 16px; background-color: #007bff; color: white; border: none; cursor: pointer; }
    #successMessage { color: green; font-weight: bold; }
  </style>
</head>
<body>
  <h1 id="pageTitle">Вітаємо на зміненій локальній сторінці</h1>
  <form id="loginForm">
    <input id="username" type="text" placeholder="Ім'я користувача" required />
    <input id="password" type="password" placeholder="Пароль" required />
    <button id="loginButton" type="submit">Увійти</button>
  </form>
  <p id="successMessage" style="display: none;"></p>
  <a id="aboutLink" href="/about.html">Перейти на сторінку "Про нас"</a>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('successMessage').style.display = 'block';
    });
  </script>
</body>
</html>
